name: moepp-ducklake

on:
  schedule:
    # Daily at 02:00 UTC
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      from-date:
        description: 'Start date (YYYY-MM-DD, optional)'
        required: false
        default: ''

concurrency:
  group: moepp-pipeline
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        run: uv python install 3.13

      - name: Sync dependencies
        run: uv sync

      - name: Run DuckLake pipeline
        env:
          MOEPP_R2_KEY_ID: ${{ secrets.MOEPP_R2_KEY_ID }}
          MOEPP_R2_SECRET: ${{ secrets.MOEPP_R2_SECRET }}
          MOEPP_R2_ACCOUNT_ID: ${{ secrets.MOEPP_R2_ACCOUNT_ID }}
          MOEPP_R2_BUCKET: ${{ secrets.MOEPP_R2_BUCKET }}
        run: |
          if [ -z "${{ inputs.from-date }}" ]; then
            uv run python run.py --destination ducklake
          else
            uv run python run.py --destination ducklake --from-date "${{ inputs.from-date }}"
          fi
